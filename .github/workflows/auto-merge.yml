name: Dependabot auto-merge
on: {pull_request:}
permissions: {contents: write, pull-requests: write}
jobs:
  merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: dependabot/fetch-metadata@v2
        id: metadata
        with: {github-token: ${{ secrets.GITHUB_TOKEN }} }
      - if: startsWith(steps.metadata.outputs.update-type, 'version-update:semver-patch') || startsWith(steps.metadata.outputs.update-type, 'version-update:semver-minor')
        run: gh pr merge --auto --squash "$PR_URL"
        env: {GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}, PR_URL: ${{ github.event.pull_request.html_url }}}

