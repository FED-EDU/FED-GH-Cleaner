name: Stale
on:
  schedule: [{ cron: "0 0 * * *" }]
  workflow_dispatch:
jobs:
  stale:
    runs-on: ubuntu-latest
    permissions: { issues: write, pull-requests: write }
    steps:
      - uses: actions/stale@v9
        with: { repo-token: "${{ secrets.GITHUB_TOKEN }}", days-before-stale: 60, days-before-close: 14, stale-issue-label: stale, stale-pr-label: stale }
