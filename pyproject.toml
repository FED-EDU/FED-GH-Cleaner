[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gh-cleaner"
version = "0.2.0"
description = "Delete old GitHub workflow runs and artifacts"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "FED-OS" }]
license = { file = "LICENSE" }
dependencies = ["requests>=2.31.0", "click>=8.1.0", "python-dateutil>=2.8.2"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "responses>=0.23", "ruff>=0.6"]

[project.scripts]
gh-cleaner = "gh_cleaner.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gh_cleaner"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
